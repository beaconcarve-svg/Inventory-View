<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Inventory</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Open Sans', sans-serif;
      background-color: #ffffff;
      color: #202124;
      margin: 0;
      padding: 10px;
    }

    /* Make table scrollable if too wide */
    #inventory-wrapper {
      overflow-x: auto;
      width: 100%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: auto; /* Auto-sizing columns */
    }

    th, td {
      padding: 10px;
      text-align: left;
      white-space: nowrap; /* Prevent wrapping */
      border-bottom: 1px solid #2D6A4F;
    }

    th {
      background-color: #1B4332;
      color: white;
      font-weight: 600;
      font-size: 16px;
      border-bottom: 2px solid #1B4332;
    }

    /* Optional: Prevent text selection */
    th, td {
      user-select: none;
    }

    /* Removed hover effects entirely */
  </style>
</head>
<body>
  <div id="inventory-wrapper">
    <div id="inventory-table">Loading...</div>
  </div>

  <script>
    // Define columns per pattern prefix
    const columnMap = {
      "12": [
        { index: 1, name: "Type" },
        { index: 3, name: "Colour" },
        { index: 4, name: "Quantity" }
      ],
      "13": [
        { index: 1, name: "Model" },
        { index: 2, name: "Size" },
        { index: 3, name: "Colour" },
        { index: 4, name: "Quantity" }
      ],
      "26": [
        { index: 1, name: "Shape" },
        { index: 2, name: "Style" },
        { index: 3, name: "Material" },
        { index: 4, name: "Quantity" }
      ]
    };

    const urlParams = new URLSearchParams(window.location.search);
const skuValue = urlParams.get('sku') || "";
    
    // Add cache-busting timestamp
    const csvUrl = `https://docs.google.com/spreadsheets/d/e/2PACX-1vRlfQw73reyRx8u7l2BddPxwZozhN9dzI5wB6ez0KpvuYfQi6y7vZEF7eX14Hc1GAb1OLdMp0DJEInn/pub?gid=0&single=true&output=csv&cacheBust=${Date.now()}`;

    function parseCSV(text) {
      return text.trim().split("\n").map(line => line.split(","));
    }
function getStockStatus(value) {
  const qty = parseInt(value);

  if (isNaN(qty)) return "Unknown";

  if (qty === 0) return "Out of Stock (0)";
  if (qty <= 5) return `Low Stock (${qty})`;
  return `In Stock (${qty})`;
}
 function loadInventory(sku) {
  fetch(csvUrl)
    .then(res => res.text())
    .then(text => {
      const data = parseCSV(text);

      // Find exact SKU match
      const item = data.find(row => row[0] === sku);

      if (!item) {
        document.getElementById("inventory-table").innerHTML = "SKU not found";
        return;
      }

      const status = getStockStatus(item[4]);

      // ONLY show the result (no table)
      document.getElementById("inventory-table").innerHTML = status;
    })
    .catch(err => {
      document.getElementById("inventory-table").innerHTML = "Error loading inventory";
    });
}

    loadInventory(skuValue);
setInterval(() => loadInventory(skuValue), 60000);
  </script>
</body>
</html>
