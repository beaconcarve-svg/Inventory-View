<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Open Sans', sans-serif;
      background-color: #ffffff;
      color: #202124;
      margin: 0;
      padding: 10px;
    }

    #inventory-wrapper {
      overflow-x: auto;
      width: 100%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: auto;
    }

    th, td {
      padding: 10px;
      text-align: left;
      white-space: nowrap;
      border-bottom: 1px solid #2D6A4F;
    }

    th {
      background-color: #1B4332;
      color: white;
      font-weight: 600;
      font-size: 16px;
      border-bottom: 2px solid #1B4332;
    }

    th, td {
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="inventory-wrapper">
    <div id="inventory-table">Loading...</div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const skuValue = urlParams.get('sku') || "";

    // CSV URL with cache-busting
    const csvUrl = `https://docs.google.com/spreadsheets/d/e/2PACX-1vRlfQw73reyRx8u7l2BddPxwZozhN9dzI5wB6ez0KpvuYfQi6y7vZEF7eX14Hc1GAb1OLdMp0DJEInn/pub?gid=0&single=true&output=csv&cacheBust=${Date.now()}`;

    function parseCSV(text) {
      return text.trim().split("\n").map(line => line.split(","));
    }

    function getStockStatus(value) {
      const qty = parseInt(value);
      if (isNaN(qty)) return "Unknown";
      if (qty === 0) return "Out of Stock (0)";
      if (qty <= 5) return `Low Stock (${qty})`;
      return `In Stock (${qty})`;
    }

    function loadInventory(sku) {
      fetch(csvUrl)
        .then(res => res.text())
        .then(text => {
          const data = parseCSV(text);

          // Find the SKU by matching column 1 (SKU)
          const item = data.find(row => row[0] && row[0].trim() === sku.trim());

          if (!item) {
            document.getElementById("inventory-table").innerHTML = "SKU not found";
            return;
          }

          // Get stock quantity from column 4
          const status = getStockStatus(item[3]);  // Column 4 is index 3

          // Display the stock status
          document.getElementById("inventory-table").innerHTML = `Stock Status: ${status}`;
        })
        .catch(err => {
          document.getElementById("inventory-table").innerHTML = "Error loading inventory";
        });
    }

    loadInventory(skuValue);

    // Refresh every minute
    setInterval(() => loadInventory(skuValue), 60000);
  </script>
</body>
</html>
</html>
