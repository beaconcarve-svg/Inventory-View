<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"> <!-- Font: Roboto -->
  <style>
    body {
      font-family: 'Open Sans', sans-serif;  /* Apply Roboto font */
      background-color: #ffffff;
      color: #202124;
      margin: 0;
      padding: 10px;
      display: flex;
      justify-content: center; /* Center horizontally */
      align-items: center;     /* Center vertically */
      height: 100vh;           /* Full viewport height */
      text-align: center;      /* Center text horizontally */
    }

    #inventory-wrapper {
      overflow-x: auto;
      width: 100%;
      max-width: 600px; /* Optional: Set a max width for better appearance */
    }

    #inventory-table {
      padding: 20px;
      font-size: 20px; /* Adjust font size for better readability */
    }

  </style>
</head>
<body>
  <div id="inventory-wrapper">
    <div id="inventory-table">Loading...</div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const skuValue = urlParams.get('sku') || "";

    // CSV URL with cache-busting
    const csvUrl = `https://docs.google.com/spreadsheets/d/e/2PACX-1vRlfQw73reyRx8u7l2BddPxwZozhN9dzI5wB6ez0KpvuYfQi6y7vZEF7eX14Hc1GAb1OLdMp0DJEInn/pub?gid=0&single=true&output=csv&cacheBust=${Date.now()}`;

    function parseCSV(text) {
      return text.trim().split("\n").map(line => line.split(","));
    }

    function getStockStatus(value) {
      const qty = parseInt(value);
      if (isNaN(qty)) return "Unknown";
      if (qty === 0) return "Out of Stock (0)";
      if (qty <= 5) return `Low Stock (${qty})`;
      return `In Stock (${qty})`;
    }

    function loadInventory(sku) {
      fetch(csvUrl)
        .then(res => res.text())
        .then(text => {
          const data = parseCSV(text);

          // Find the SKU by matching column 1 (SKU)
          const item = data.find(row => row[0] && row[0].trim() === sku.trim());

          if (!item) {
            document.getElementById("inventory-table").innerHTML = "SKU not found";
            return;
          }

          // Get stock quantity from column 4
          const status = getStockStatus(item[3]);  // Column 4 is index 3

          // Remove "Stock Status:" and just show the stock status text
          document.getElementById("inventory-table").innerHTML = status;
        })
        .catch(err => {
          document.getElementById("inventory-table").innerHTML = "Error loading inventory";
        });
    }

    loadInventory(skuValue);

    // Refresh every minute
    setInterval(() => loadInventory(skuValue), 60000);
  </script>
</body>
</html>
